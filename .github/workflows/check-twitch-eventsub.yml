
name: Check Twitch EventSub

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check subscription status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node <<'NODE'
          async function main() {
            const tokenResponse = await fetch(
              "https://id.twitch.tv/oauth2/token",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                  client_id: process.env.TWITCH_CLIENT_ID,
                  client_secret: process.env.TWITCH_CLIENT_SECRET,
                  grant_type: "client_credentials"
                })
              }
            );

            const token = await tokenResponse.json();

            if (!tokenResponse.ok) {
              throw new Error(JSON.stringify(token));
            }

            const response = await fetch(
              "https://api.twitch.tv/helix/eventsub/subscriptions?type=channel.chat.message",
              {
                headers: {
                  "Client-Id": process.env.TWITCH_CLIENT_ID,
                  "Authorization": `Bearer ${token.access_token}`
                }
              }
            );

            const result = await response.json();

            if (!response.ok) {
              throw new Error(JSON.stringify(result));
            }

            console.log("Suscripciones encontradas:", result.total);

            for (const sub of result.data || []) {
              console.log("-----------------------------");
              console.log("ID:", sub.id);
              console.log("Tipo:", sub.type);
              console.log("Estado:", sub.status);
              console.log("Transporte:", sub.transport.method);
            }
          }

          main().catch(error => {
            console.error("ERROR:", error.message);
            process.exit(1);
          });
          NODE
