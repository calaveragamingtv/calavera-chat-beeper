name = "calavera-chat-beeper"
main = "src/index.js"
compatibility_date = "2026-11-19"

[assets]
directory = "../frontend"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[exports.ChatRoom]
type = "durable-object"
storage = "sqlite"
